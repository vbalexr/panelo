# Builds the Hugo site in site/ and deploys it to GitHub Pages.
# One-time setup: repo Settings > Pages > Source: GitHub Actions.
name: Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "site/**"
      - "CONTRIBUTING.md"
      - "PRIVACY.md"
      - "LICENSE"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - id: pages
        uses: actions/configure-pages@v6

      # site/setup.sh downloads the pinned Hugo extended + Hextra (versions and SHA-256
      # in site/versions.env). build.sh runs `hugo --minify --gc` (broken ref links are
      # errors via refLinksErrorLevel) and then checks every internal link in the output.
      # BASE_URL comes from Pages, so a custom domain is picked up automatically.
      - name: Build
        env:
          BASE_URL: ${{ steps.pages.outputs.base_url }}/
        run: site/build.sh

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
