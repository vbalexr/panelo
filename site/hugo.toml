# Panelo documentation site (Hugo + Hextra theme). Hugo project root = site/.
#
# >>> PLACEHOLDERS TO REPLACE once the repository exists: <<<
#   1. baseURL below (drop the path part if you use a custom domain)
#   2. [params.panelo] owner / repo below (used for every GitHub link on the site)
baseURL = "https://vbalexr.github.io/panelo/"
title = "Panelo"
locale = "en"
defaultContentLanguage = "en"
theme = "hextra"
enableRobotsTXT = true
enableGitInfo = false

# Broken {{< ref >}} / relref links fail the build.
refLinksErrorLevel = "ERROR"
refLinksNotFoundURL = ""

[params.panelo]
  owner = "vbalexr"
  repo = "panelo"

[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.highlight]
    noClasses = false

[module]
  [module.hugoVersion]
    extended = true
    min = "0.146.0"
  # Single source of truth: docs/*.md, CONTRIBUTING.md and PRIVACY.md live in the repo, outside
  # site/, and are mounted into the content tree here (no copies, no front matter).
  # Site-only pages live in site/content. Titles/ordering for the mounted files
  # are set by the [[cascade]] blocks at the bottom of this file.
  [[module.mounts]]
    source = "content"
    target = "content"
  [[module.mounts]]
    source = "static"
    target = "static"
  [[module.mounts]]
    source = "layouts"
    target = "layouts"
  [[module.mounts]]
    source = "assets"
    target = "assets"
  [[module.mounts]]
    source = "data"
    target = "data"
  [[module.mounts]]
    source = "i18n"
    target = "i18n"
  [[module.mounts]]
    source = "../docs"
    target = "content/reference"
    files = ["RemoteConfig.md", "DeviceOwnerSetup.md"]
  [[module.mounts]]
    source = ".."
    target = "content/development"
    files = ["CONTRIBUTING.md"]
  [[module.mounts]]
    source = ".."
    target = "content/legal"
    files = ["PRIVACY.md"]

[menu]
  [[menu.main]]
    name = "Guide"
    pageRef = "/guide"
    weight = 1
  [[menu.main]]
    name = "Reference"
    pageRef = "/reference"
    weight = 2
  [[menu.main]]
    name = "Development"
    pageRef = "/development"
    weight = 3
  [[menu.main]]
    name = "Privacy"
    pageRef = "/privacy"
    weight = 4
  [[menu.main]]
    name = "Search"
    weight = 5
    [menu.main.params]
      type = "search"
  [[menu.main]]
    name = "GitHub"
    weight = 6
    url = "https://github.com/vbalexr/panelo"
    [menu.main.params]
      icon = "github"

[params]
  description = "Turn an Android phone or tablet into a dedicated, self-healing kiosk for one web app."

  [params.navbar]
    displayTitle = true
    displayLogo = true
    width = "wide"
    [params.navbar.logo]
      path = "logo.svg"
      dark = "logo-dark.svg"
      width = 27
      height = 20

  [params.page]
    width = "wide"

  [params.theme]
    default = "system"
    displayToggle = true

  [params.search]
    enable = true
    [params.search.flexsearch]
      index = "content"
      tokenize = "forward"

  [params.footer]
    enable = true
    displayCopyright = false
    displayPoweredBy = false
    width = "wide"

  [params.editURL]
    enable = false

# Titles, order and URLs for the mounted repo files (no front matter in them).
[[cascade]]
  [cascade.target]
    path = "/reference/remoteconfig"
  [cascade.params]
    title = "Remote configuration"
    weight = 1
    slug = "remote-config"
[[cascade]]
  [cascade.target]
    path = "/reference/deviceownersetup"
  [cascade.params]
    title = "Device Owner setup"
    weight = 2
    slug = "device-owner"
[[cascade]]
  [cascade.target]
    path = "/development/contributing"
  [cascade.params]
    title = "Contributing"
    weight = 1
    slug = "contributing"
[[cascade]]
  [cascade.target]
    path = "/legal/privacy"
  [cascade.params]
    title = "Privacy policy"
    url = "/privacy/"
    type = "docs"
    sidebar = { exclude = true }
