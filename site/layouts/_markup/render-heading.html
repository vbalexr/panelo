{{- /* The mounted repo docs start with their own "# Title". The page title is already rendered by the theme, so drop level-1 headings to avoid a duplicate H1. */ -}}
{{- if gt .Level 1 -}}
<h{{ .Level }} data-hextra-search-id="{{ .Anchor | safeURL }}" {{- with .Attributes.class }} class="{{ . }}" {{- end }}>
  {{- .Text | safeHTML -}}
  <span class="hx:absolute hx:-mt-20" id="{{ .Anchor | safeURL }}"></span>
  <a href="#{{ .Anchor | safeURL }}" class="subheading-anchor" aria-label="Permalink for this section"></a>
</h{{ .Level }}>
{{- end -}}
